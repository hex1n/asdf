name: tests

# Enforce the repo's anti-drift contract tests on every change. The suite is
# stdlib unittest, but the workflow hook it exercises is Node, so CI provides
# both python3 and node.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show runtime versions
        run: |
          python3 --version
          node --version

      - name: Repo-level contract tests
        run: python3 -m unittest discover -s tests

      - name: Per-skill tests (java-stack-craft)
        run: python3 -m unittest discover -s skills/java-stack-craft/tests
